# Deploy the CV site to GitHub Pages.
#
# FIRST USE of this exact pattern anywhere near nixos-config (Tier 0 §2.3 —
# no existing workflow uses upload-pages-artifact/deploy-pages). Mirrors the
# install-nix + nix build skeleton of nixos-config's .github/workflows/ci.yml.
#
# Version pins checked against `gh api .../releases/latest` on 2026-08-29:
# checkout v7, configure-pages v6, upload-pages-artifact v5, deploy-pages v5,
# install-nix-action v31 (Tier 1 supplemental C2).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            fallback = true

      - name: Build site (zola, nixpkgs 9ae611a pin)
        run: |
          nix build .#site --out-link site
          ls -la site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # deploy-pages is the only deploy step for this repo (user page:
  # https://Cairnstew.github.io). No second job needed — deployment runs
  # from the artifact uploaded above.