<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 46rem; margin: 0 auto; padding: 1rem 1.5rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    nav a { margin-right: 0.75rem; }
    h1, h2 { line-height: 1.2; }
    .muted { opacity: 0.65; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid; opacity: 0.55; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ get_url(path="/") }}">Home</a>
      {% if section is defined and section.subsections -%}
        {% for s in section.subsections -%}
          {% set sub = get_section(path=s) -%}
          <a href="{{ sub.permalink }}">{{ sub.title }}</a>
        {%- endfor %}
      {%- endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer>{{ config.title }} · generated with Zola</footer>
</body>
</html>
